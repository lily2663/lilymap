name: Release LilyMap for Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable executable
        run: npm run release
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/LilyMap.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LilyMap.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/LilyMap.exe
            dist/lilymap.json.example
            dist/SHA256SUMS.txt
