name: Release LilyMap for Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable executable
        run: npm run release
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/LilyMap.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LilyMap.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LilyMap.exe
            dist/lilymap.json.example
            dist/SHA256SUMS.txt
