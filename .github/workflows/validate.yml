name: Validate LilyMap

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      theme_ref:
        type: string
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read compatible theme pin
        id: theme-pin
        shell: bash
        run: |
          ref='${{ inputs.theme_ref }}'
          if [ -z "$ref" ]; then
            ref=$(node -p "require('./.github/theme-compatibility.json').ref")
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out compatible theme
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lily2663/lily-epitaph
          ref: ${{ steps.theme-pin.outputs.ref }}
          path: .test/lily-epitaph
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: 0.165.0
          extended: false
      - name: Run tests including theme integration
        run: npm test
        env:
          LILY_TEST_THEME_PATH: ${{ github.workspace }}/.test/lily-epitaph
          LILY_TEST_HUGO_PATH: hugo
      - run: npm run check
      - name: Validate pinned theme protocol manifests
        run: npm run protocol:check
        env:
          LILY_TEST_THEME_PATH: ${{ github.workspace }}/.test/lily-epitaph
      - run: npm run build
